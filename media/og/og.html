<!doctype html>
<!-- Fuente de public/og.png y public/og-en.png (`?en`). Marca, colores y titular de la web.
     Se regenera con: node media/og/render.mjs -->
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bricolage Grotesque Variable'; src: url(../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2); font-weight: 200 800; }
  @font-face { font-family: 'Inter Variable'; src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #0d1017; font-family: 'Inter Variable'; padding: 72px 80px; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 750; letter-spacing: -0.03em; }
  h1 { font-family: 'Bricolage Grotesque Variable'; font-weight: 800; font-size: 104px; line-height: 1.04; margin-top: 64px; }
  p { font-size: 32px; color: #5b6474; margin-top: 28px; }
  .tags { display: flex; gap: 16px; margin-top: 48px; font-size: 26px; font-weight: 600; }
  .tags span { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px; background: var(--bg); }
  .tags span::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--dot); }
</style>
<div class="brand">
  <svg viewBox="0 0 24 32" height="52"><g fill="#0d1017"><circle cx="4" cy="4" r="3.6"/><circle cx="4" cy="12" r="3.6"/><circle cx="4" cy="20" r="3.6"/><circle cx="12" cy="28" r="3.6"/><circle cx="20" cy="12" r="3.6"/><circle cx="20" cy="20" r="3.6"/></g><rect x="16.4" y="0.4" width="7.2" height="7.2" fill="#0031e6"/></svg>
  Understaffed
</div>
<h1></h1>
<p></p>
<div class="tags">
  <span style="--bg:#ecdcff;--dot:#b48af5">Backend</span>
  <span style="--bg:#ffe3c8;--dot:#f6a15e">Frontend</span>
  <span style="--bg:#d3f5df;--dot:#5cc98a"></span>
  <span style="--bg:#fff0bf;--dot:#efbf3f">Tester</span>
</div>
<script>
  const en = location.search === '?en';
  document.querySelector('h1').innerHTML = en ? 'Every task goes<br>through you twice' : 'Cada tarea pasa<br>por ti dos veces';
  document.querySelector('p').textContent = en ? 'A team of AI agents for your software projects.' : 'Un equipo de agentes de IA para tus proyectos de software.';
  document.querySelector('.tags span:nth-child(3)').textContent = en ? 'Analyst' : 'Analista';
</script>
